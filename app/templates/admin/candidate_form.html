{% extends 'admin/base_admin.html' %}
{% block title %}Add Candidate — {{ app_name }}{% endblock %}
{% block admin_content %}
<div class="max-w-xl animate-slide-up">
  <div class="mb-6">
    <a href="{{ url_for('admin.election_detail', election_id=election.election_id) }}"
       class="flex items-center gap-1.5 text-sm text-gray-400 hover:text-brand-600 mb-4 transition-colors">
      <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>Back to {{ election.title }}
    </a>
    <h1 class="font-display font-bold text-2xl text-gray-900">Add Candidate</h1>
  </div>

  <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-8">
    <form method="post" enctype="multipart/form-data" class="space-y-5">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

      <div>
        <label for="position_id" class="block text-sm font-medium text-gray-700 mb-1.5">Position <span class="text-red-500">*</span></label>
        <select id="position_id" name="position_id" required
          class="block w-full px-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 transition-all bg-white">
          <option value="">Select a position…</option>
          {% for position in election.positions %}
          <option value="{{ position.position_id }}">{{ position.title }}</option>
          {% endfor %}
        </select>
      </div>

      <div>
        <label for="full_name" class="block text-sm font-medium text-gray-700 mb-1.5">Full Name <span class="text-red-500">*</span></label>
        <input id="full_name" name="full_name" type="text" required placeholder="Candidate's full name"
          class="block w-full px-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 transition-all" />
      </div>

      <div>
        <label for="matric_number" class="block text-sm font-medium text-gray-700 mb-1.5">Matric Number (optional)</label>
        <input id="matric_number" name="matric_number" type="text" placeholder="e.g. 20220204224"
          class="block w-full px-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 transition-all" />
      </div>

      <div>
        <label for="photo" class="block text-sm font-medium text-gray-700 mb-1.5">Photo (optional)</label>
        <input id="photo" name="photo" type="file" accept="image/*"
          class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-brand-50 file:text-brand-700 hover:file:bg-brand-100 transition-all" />
      </div>

      <div>
        <label for="manifesto" class="block text-sm font-medium text-gray-700 mb-1.5">Manifesto (optional)</label>
        <textarea id="manifesto" name="manifesto" rows="4" placeholder="Short campaign statement…"
          class="block w-full px-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 transition-all resize-none"></textarea>
      </div>

      <button type="submit"
        class="w-full flex items-center justify-center gap-2 py-3 bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-xl transition-all">
        <i data-lucide="user-plus" class="w-4 h-4"></i>
        Add Candidate
      </button>
    </form>
  </div>
</div>
{% endblock %}
