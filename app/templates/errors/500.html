{% extends 'base.html' %}
{% block title %}500 Server Error — {{ app_name }}{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-50 px-4">
  <div class="text-center animate-slide-up">
    <div class="w-16 h-16 rounded-2xl bg-gray-100 flex items-center justify-center mx-auto mb-6">
      <i data-lucide="server-crash" class="w-8 h-8 text-gray-400"></i>
    </div>
    <div class="text-8xl font-display font-bold text-gray-100 mb-4">500</div>
    <h1 class="font-display font-bold text-2xl text-gray-900 mb-2">Something went wrong</h1>
    <p class="text-gray-500 mb-8">An unexpected error occurred. The team has been notified. Please try again shortly.</p>
    <a href="{{ url_for('public.index') }}"
       class="inline-flex items-center gap-2 px-6 py-3 bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-xl transition-all">
      <i data-lucide="home" class="w-4 h-4"></i>Go to Homepage
    </a>
  </div>
</div>
{% endblock %}
