{% extends 'base.html' %}
{% block title %}429 Too Many Requests — {{ app_name }}{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-50 px-4">
  <div class="text-center animate-slide-up">
    <div class="w-16 h-16 rounded-2xl bg-amber-100 flex items-center justify-center mx-auto mb-6">
      <i data-lucide="clock" class="w-8 h-8 text-amber-500"></i>
    </div>
    <div class="text-8xl font-display font-bold text-gray-100 mb-4">429</div>
    <h1 class="font-display font-bold text-2xl text-gray-900 mb-2">Too many requests</h1>
    <p class="text-gray-500 mb-8">You've made too many requests. Please wait a moment before trying again.</p>
    <a href="{{ url_for('public.index') }}"
       class="inline-flex items-center gap-2 px-6 py-3 bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-xl transition-all">
      <i data-lucide="home" class="w-4 h-4"></i>Go to Homepage
    </a>
  </div>
</div>
{% endblock %}
