{% extends 'base.html' %}
{% block title %}404 Not Found — {{ app_name }}{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-50 px-4">
  <div class="text-center animate-slide-up">
    <div class="text-8xl font-display font-bold text-gray-100 mb-4">404</div>
    <h1 class="font-display font-bold text-2xl text-gray-900 mb-2">Page not found</h1>
    <p class="text-gray-500 mb-8">The page you're looking for doesn't exist or results haven't been published yet.</p>
    <a href="{{ url_for('public.index') }}"
       class="inline-flex items-center gap-2 px-6 py-3 bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-xl transition-all">
      <i data-lucide="home" class="w-4 h-4"></i>Go to Homepage
    </a>
  </div>
</div>
{% endblock %}
