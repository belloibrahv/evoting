{% extends 'base.html' %}
{% block title %}Set New Password — {{ app_name }}{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-50 px-4 py-24">
  <div class="w-full max-w-md animate-slide-up">
    <div class="text-center mb-8">
      <div class="w-12 h-12 rounded-2xl bg-brand-100 flex items-center justify-center mx-auto mb-4">
        <i data-lucide="lock" class="w-6 h-6 text-brand-600"></i>
      </div>
      <h1 class="font-display font-bold text-2xl text-gray-900">Set a new password</h1>
    </div>
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
      <form method="post" action="{{ url_for('auth.password_reset_confirm', token=token) }}" class="space-y-5">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
        <div>
          <label for="password" class="block text-sm font-medium text-gray-700 mb-1.5">New Password</label>
          <input id="password" name="password" type="password" required placeholder="Min 8 chars, 1 letter, 1 number"
            class="block w-full px-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 transition-all" />
        </div>
        <div>
          <label for="confirm_password" class="block text-sm font-medium text-gray-700 mb-1.5">Confirm Password</label>
          <input id="confirm_password" name="confirm_password" type="password" required placeholder="Repeat password"
            class="block w-full px-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 transition-all" />
        </div>
        <button type="submit"
          class="w-full flex items-center justify-center gap-2 py-3.5 bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-xl transition-all">
          <i data-lucide="check" class="w-4 h-4"></i>
          Update Password
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
