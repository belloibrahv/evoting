{% extends 'base.html' %}
{% block title %}Register — {{ app_name }}{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-50 px-4 py-24">
  <div class="w-full max-w-lg animate-slide-up">

    <div class="text-center mb-8">
      <div class="w-12 h-12 rounded-2xl bg-brand-100 flex items-center justify-center mx-auto mb-4">
        <i data-lucide="user-plus" class="w-6 h-6 text-brand-600"></i>
      </div>
      <h1 class="font-display font-bold text-2xl text-gray-900">Create your voter account</h1>
      <p class="text-gray-500 text-sm mt-1">Your matriculation number must be on the eligible-voter roster.</p>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
      <form method="post" action="{{ url_for('auth.register') }}" class="space-y-5" novalidate>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

        <!-- Full name -->
        <div>
          <label for="full_name" class="block text-sm font-medium text-gray-700 mb-1.5">Full Name</label>
          <input id="full_name" name="full_name" type="text" required autocomplete="name"
            value="{{ form_data.get('full_name', '') }}" placeholder="As on your student ID"
            class="block w-full px-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition-all" />
        </div>

        <!-- Matric number -->
        <div>
          <label for="matric_number" class="block text-sm font-medium text-gray-700 mb-1.5">Matriculation Number</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
              <i data-lucide="hash" class="w-4 h-4 text-gray-400"></i>
            </div>
            <input id="matric_number" name="matric_number" type="text" required
              value="{{ form_data.get('matric_number', '') }}" placeholder="e.g. 20220204224"
              class="block w-full pl-10 pr-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 transition-all" />
          </div>
        </div>

        <!-- Email -->
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700 mb-1.5">
            Email <span class="text-gray-400 font-normal">(optional, for password reset)</span>
          </label>
          <input id="email" name="email" type="email" autocomplete="email"
            value="{{ form_data.get('email', '') }}" placeholder="you@example.com"
            class="block w-full px-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 transition-all" />
        </div>

        <!-- Password -->
        <div x-data="{show: false, strength: 0}"
             x-effect="
               const p = $el.querySelector('#password').value;
               let s = 0;
               if (p.length >= 8) s++;
               if (/[A-Za-z]/.test(p) && /[0-9]/.test(p)) s++;
               if (p.length >= 12) s++;
               strength = s;
             ">
          <label for="password" class="block text-sm font-medium text-gray-700 mb-1.5">Password</label>
          <div class="relative">
            <input id="password" name="password" :type="show ? 'text' : 'password'" required
              placeholder="Min 8 chars, 1 letter, 1 number"
              @input="$dispatch('input')"
              class="block w-full pl-4 pr-11 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 transition-all" />
            <button type="button" @click="show = !show"
              class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-gray-400 hover:text-gray-600">
              <i x-show="!show" data-lucide="eye" class="w-4 h-4"></i>
              <i x-show="show" data-lucide="eye-off" class="w-4 h-4"></i>
            </button>
          </div>
          <!-- Strength bar -->
          <div class="mt-2 flex gap-1">
            <div class="h-1 flex-1 rounded-full transition-colors" :class="strength >= 1 ? 'bg-red-400' : 'bg-gray-100'"></div>
            <div class="h-1 flex-1 rounded-full transition-colors" :class="strength >= 2 ? 'bg-amber-400' : 'bg-gray-100'"></div>
            <div class="h-1 flex-1 rounded-full transition-colors" :class="strength >= 3 ? 'bg-accent-500' : 'bg-gray-100'"></div>
          </div>
        </div>

        <!-- Confirm password -->
        <div x-data="{match: true}" x-effect="
          const p = document.getElementById('password')?.value;
          const c = $el.querySelector('#confirm_password').value;
          match = !c || p === c;
        ">
          <label for="confirm_password" class="block text-sm font-medium text-gray-700 mb-1.5">Confirm Password</label>
          <input id="confirm_password" name="confirm_password" type="password" required
            placeholder="Repeat your password"
            class="block w-full px-4 py-3 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 transition-all"
            :class="match ? 'border-gray-200' : 'border-red-300 bg-red-50'" />
          <p x-show="!match" class="mt-1 text-xs text-red-600">Passwords do not match.</p>
        </div>

        <button type="submit"
          class="w-full flex items-center justify-center gap-2 py-3.5 px-6 bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-xl transition-all hover:scale-[1.01] shadow-sm">
          <i data-lucide="user-check" class="w-4 h-4"></i>
          Create Account
        </button>
      </form>
    </div>

    <p class="mt-6 text-center text-sm text-gray-500">
      Already registered?
      <a href="{{ url_for('auth.login') }}" class="text-brand-600 font-semibold hover:text-brand-700 transition-colors">Sign in</a>
    </p>
  </div>
</div>
{% endblock %}
