{% extends 'base.html' %}
{% block title %}Password Reset — {{ app_name }}{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-50 px-4 py-24">
  <div class="w-full max-w-md animate-slide-up">
    <div class="text-center mb-8">
      <div class="w-12 h-12 rounded-2xl bg-amber-100 flex items-center justify-center mx-auto mb-4">
        <i data-lucide="key" class="w-6 h-6 text-amber-600"></i>
      </div>
      <h1 class="font-display font-bold text-2xl text-gray-900">Reset your password</h1>
      <p class="text-gray-500 text-sm mt-1">Enter your matriculation number to receive a reset token.</p>
    </div>
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
      <form method="post" action="{{ url_for('auth.password_reset_request') }}" class="space-y-5">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
        <div>
          <label for="matric_number" class="block text-sm font-medium text-gray-700 mb-1.5">Matriculation Number</label>
          <input id="matric_number" name="matric_number" type="text" required placeholder="e.g. 20220204224"
            class="block w-full px-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 transition-all" />
        </div>
        <button type="submit"
          class="w-full flex items-center justify-center gap-2 py-3.5 bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-xl transition-all">
          <i data-lucide="send" class="w-4 h-4"></i>
          Send Reset Token
        </button>
      </form>
    </div>
    <p class="mt-4 text-center text-sm text-gray-500">
      <a href="{{ url_for('auth.login') }}" class="text-brand-600 hover:text-brand-700 font-medium transition-colors">Back to login</a>
    </p>
  </div>
</div>
{% endblock %}
