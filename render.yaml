services:
  # ── Flask web service ─────────────────────────────────────────────────
  - type: web
    name: tasfued-evs
    runtime: python
    region: oregon
    plan: free

    buildCommand: pip install -r requirements.txt

    # Init DB (idempotent create_all) then start gunicorn
    startCommand: bash scripts/start.sh

    envVars:
      - key: FLASK_ENV
        value: production

      - key: SECRET_KEY
        generateValue: true

      - key: DATABASE_URL
        fromDatabase:
          name: tasfued-evs-db
          property: connectionString

      - key: BCRYPT_LOG_ROUNDS
        value: "12"

      - key: SESSION_IDLE_TIMEOUT
        value: "1800"

      - key: LOG_LEVEL
        value: INFO

      - key: ADMIN_MATRIC
        value: ADMIN001

      # Set ADMIN_DEFAULT_PASSWORD in the Render dashboard — do NOT commit it
      - key: ADMIN_DEFAULT_PASSWORD
        sync: false

    healthCheckPath: /

  # ── PostgreSQL database ────────────────────────────────────────────────
databases:
  - name: tasfued-evs-db
    databaseName: evoting_db
    user: evs
    region: oregon
    plan: free
